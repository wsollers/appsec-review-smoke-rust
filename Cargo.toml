[package]
name = "appsec-review-smoke-rust"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[[bin]]
name = "rust-synthetic"
path = "src/main.rs"

[[bin]]
name = "smoke-server"
path = "src/server/main.rs"

# Optional features; none is enabled by default and the binaries use none of them.
[features]
legacy-time = ["dep:time"]
normalize = ["dep:unicode-normalization"]

[dependencies]
reqwest = { path = "vendor/reqwest" }
rusqlite = { path = "vendor/rusqlite" }
serde_json = { path = "vendor/serde_json" }
time = { version = "=0.1.43", optional = true }
unicode-normalization = { version = "=0.1.9", optional = true }
